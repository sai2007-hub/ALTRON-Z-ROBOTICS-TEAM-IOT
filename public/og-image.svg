<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090C" />
      <stop offset="60%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Crimson Glow Radial -->
    <radialGradient id="red-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#DC2626" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="center-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="circuit-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Field -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#circuit-grid)" />
  <rect width="1200" height="630" fill="url(#red-glow)" />

  <!-- Outer Hairline Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#262D3D" stroke-width="1.5" />
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#DC2626" stroke-width="1" stroke-opacity="0.25" />

  <!-- Corner Tech Accent Crosses -->
  <g stroke="#EF4444" stroke-width="2" opacity="0.6">
    <path d="M 40 46 L 52 46 M 46 40 L 46 52" />
    <path d="M 1148 46 L 1160 46 M 1154 40 L 1154 52" />
    <path d="M 40 584 L 52 584 M 46 578 L 46 590" />
    <path d="M 1148 584 L 1160 584 M 1154 578 L 1154 590" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 96)">
    <!-- Kicker Tag -->
    <rect x="0" y="0" width="370" height="34" rx="6" fill="#141926" stroke="#DC2626" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="17" r="4" fill="#EF4444" />
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" letter-spacing="1.5">
      ROBOTICS &amp; EMBEDDED SYSTEMS SOCIETY
    </text>

    <!-- Main Title -->
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      ALTRON'Z
    </text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#EF4444" letter-spacing="3">
      ROBOTICS TEAM &amp; IOT
    </text>

    <!-- Value Proposition -->
    <text x="0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF" width="620">
      Engineering Autonomous Machines &amp; Battle-Hardened Combat Bots.
    </text>
    <text x="0" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF">
      Hands-on IoT, Bare-Metal Firmware &amp; STEM Workshops for Schools &amp; Colleges.
    </text>

    <!-- 3 Core Disciplines Badges -->
    <g transform="translate(0, 276)">
      <!-- Item 1: Robo Sumo -->
      <g transform="translate(0, 0)">
        <rect width="180" height="52" rx="8" fill="#0E121B" stroke="#262D3D" stroke-width="1" />
        <text x="16" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#EF4444" letter-spacing="1">CHAMPIONSHIP</text>
        <text x="16" y="41" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F3F4F6">3.0 kg Robo Sumo</text>
      </g>

      <!-- Item 2: Robo Soccer -->
      <g transform="translate(196, 0)">
        <rect width="180" height="52" rx="8" fill="#0E121B" stroke="#262D3D" stroke-width="1" />
        <text x="16" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#EF4444" letter-spacing="1">TACTICAL LEAGUE</text>
        <text x="16" y="41" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F3F4F6">2v2 Omni Soccer</text>
      </g>

      <!-- Item 3: IoT Workshops -->
      <g transform="translate(392, 0)">
        <rect width="180" height="52" rx="8" fill="#0E121B" stroke="#262D3D" stroke-width="1" />
        <text x="16" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#EF4444" letter-spacing="1">STEM OUTREACH</text>
        <text x="16" y="41" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F3F4F6">IoT &amp; Embedded R&amp;D</text>
      </g>
    </g>

    <!-- Bottom URL and Verification Bar -->
    <g transform="translate(0, 360)">
      <text x="0" y="16" font-family="monospace" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="1">
        OFFICIAL PLATFORM <tspan fill="#DC2626">·</tspan> COMPETITIONS <tspan fill="#DC2626">·</tspan> REGISTRATIONS <tspan fill="#DC2626">·</tspan> HALL OF HONORS
      </text>
    </g>
  </g>

  <!-- Right Visual Emblem Area -->
  <g transform="translate(790, 115)">
    <!-- Ambient Circle Glow -->
    <circle cx="180" cy="180" r="180" fill="url(#center-core-glow)" />

    <!-- Outer Decorative Orbit Ring -->
    <circle cx="180" cy="180" r="160" fill="none" stroke="#262D3D" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
    <circle cx="180" cy="180" r="130" fill="#0B0E17" stroke="#374151" stroke-width="1.5" />

    <!-- Circuit Trace Lines -->
    <path d="M 60 180 L 110 180 M 250 180 L 300 180 M 180 60 L 180 110 M 180 250 L 180 300" stroke="#DC2626" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <circle cx="60" cy="180" r="4" fill="#EF4444" />
    <circle cx="300" cy="180" r="4" fill="#EF4444" />
    <circle cx="180" cy="60" r="4" fill="#EF4444" />
    <circle cx="180" cy="300" r="4" fill="#EF4444" />

    <!-- Titanium Mechatronic Hexagon -->
    <polygon points="180,85 262,132 262,228 180,275 98,228 98,132" fill="#121622" stroke="#DC2626" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Inner Core Geometry: White 'A' Chevron and Red 'Z' Vector -->
    <path d="M 130 220 L 180 115 L 230 220" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 148 174 L 212 174 L 140 236 L 220 236" stroke="#EF4444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central IoT Node -->
    <circle cx="180" cy="180" r="8" fill="#DC2626" />
    <circle cx="180" cy="180" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
